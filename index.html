.letter-wrap{width:min(720px,calc(100% - 40px));margin:75px auto 55px;position:relative;animation:appear .7s ease both}.letter-label{text-align:center;margin-bottom:27px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}.paper{background:var(--cream);box-shadow:0 16px 55px #9a59672b,3px 5px 0 #f5edde,-3px 10px 0 #fff9ee;border:1px solid #e6d7ca;position:relative;padding:28px 50px 35px 64px;border-radius:3px}.paper:before{content:'';position:absolute;top:0;bottom:0;left:43px;width:1px;background:#edbdc2}.paper-head{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.paper-head time{margin-left:auto;text-align:right}.skip{border:1px solid #e6c2c6;background:#fff7ef;color:#9e4559;padding:8px 12px;border-radius:20px;white-space:nowrap;font-size:12px;min-height:36px}.paper h2{font:400 clamp(27px,5vw,37px) Fraunces,serif;margin:31px 0 25px;letter-spacing:-.035em}.writing{font:400 27px/36px Caveat,cursive;background:repeating-linear-gradient(transparent 0 35px,#eac7cf8c 35px 36px);color:#653b45;min-height:72px}.writing p{margin:0 0 36px;white-space:pre-wrap}.writing p:empty{display:none}.cursor:after{content:'│';color:#bd4f64;animation:blink 1s steps(1) infinite}.ending{position:relative;padding:0 0 12px;min-height:153px}.love{font:76px/1.2 Sacramento,cursive;color:#c03f5a;margin:0}.signature{font:37px Sacramento,cursive;margin:3px 0 0}.stamp{position:absolute;right:0;top:0;width:99px;height:123px;padding:5px;background:white;transform:rotate(8deg);box-shadow:0 2px 8px #67333320;border:1px dashed #d6b0b6;object-fit:cover;object-position:center}.answer{text-align:center;padding:40px 5px 20px}.answer h2{font:400 clamp(24px,5vw,32px) Fraunces,serif;margin:8px 0 35px}.choices{display:flex;align-items:center;justify-content:center;gap:28px;min-height:116px;padding:20px 0 35px}.yes{background:#cb4769;color:white;border:1px solid #d55777;min-height:49px;border-radius:50px;padding:13px 22px;font-weight:700;font-size:15px;box-shadow:0 5 /* La secuencia inicial: corazón → sobre → vibración → estallido → carta. */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1)}
.intro{padding:90px 24px 40px;overflow:hidden;justify-content:center;gap:24px;transition:opacity .3s var(--ease-out),transform .3s var(--ease-out)}
.heart-stage,.envelope-stage{width:100%;max-width:500px;text-align:center}.heart-stage{transition:opacity .3s var(--ease-out),transform .3s var(--ease-out)}
.heart-stage.depart{opacity:0;transform:translateY(-20px) scale(.96)}
.heart-drawing{width:min(360px,85vw);aspect-ratio:360/320;position:relative;margin:22px auto 0}.heart-drawing svg{width:100%;height:100%;overflow:visible}.heart-line,.heart-halo{fill:none;stroke:#c64064;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.heart-halo{stroke:#e59ab0;stroke-width:13;opacity:.12}.heart-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw-heart 2.8s var(--ease-in-out) forwards;filter:drop-shadow(0 0 5px #d5688880)}
.heart-words{position:absolute;inset:33% 0 auto;font:clamp(58px,16vw,85px)/1.2 Sacramento,cursive;color:#be3559;margin:0;opacity:0;animation:words-in .7s var(--ease-out) 1.7s forwards}.heart-name{position:absolute;top:62%;left:0;right:0;font:14px Quicksand,sans-serif;letter-spacing:.2em;color:#9c5068;opacity:0;animation:words-in .7s var(--ease-out) 2.25s forwards}.heart-caption{font:24px Caveat,cursive;margin:17px 0 0;opacity:0;animation:words-in .7s var(--ease-out) 2.6s forwards}.envelope-stage{animation:stage-in .5s var(--ease-out) both}.envelope-stage h1{font-size:clamp(35px,8vw,50px)}
.scene{width:100%;height:255px;margin:30px auto 0}.envelope{width:min(300px,76vw);height:auto;aspect-ratio:300/195;animation:none;isolation:isolate}.seal{top:42%}.flap{transition:transform .5s var(--ease-out)}.peek{transition:transform .6s var(--ease-out)}.open .peek{transform:translateY(-65%)}.open .flap{transform:rotateX(180deg)}.envelope.shaking{animation:tremble .65s linear both}.envelope.exploding{animation:envelope-pop .8s var(--ease-out) .15s forwards}.burst-ring{position:absolute;width:220px;height:220px;border:2px solid #df739480;border-radius:50%;opacity:0;pointer-events:none}.burst-ring.go{animation:ring-out .7s var(--ease-out) both}.open-letter{border:1px solid #c84769;background:#c84769;color:white;padding:14px 35px;min-height:52px;min-width:150px;border-radius:50px;font-weight:600;font-size:16px;box-shadow:0 6px 22px #c847692e;transition:transform .15s var(--ease-out),opacity .2s ease}.open-letter span{margin-left:12px;font-size:20px}.open-letter:active{transform:scale(.96)}.open-letter:disabled{cursor:default;opacity:.55}.small-note{font-size:22px;margin:17px 0 0}.intro-footer{margin:10px 0 0}.letter-wrap{animation:letter-unfold .7s var(--ease-out) both;transform-origin:50% 15%}
@keyframes draw-heart{to{stroke-dashoffset:0}}@keyframes words-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes stage-in{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}@keyframes tremble{0%,100%{transform:rotate(0)}10%,30%,50%,70%,90%{transform:translateX(-4px) rotate(-3deg)}20%,40%,60%,80%{transform:translateX(4px) rotate(3deg)}}@keyframes envelope-pop{0%{transform:scale(1);opacity:1}35%{transform:scale(1.12);opacity:1}100%{transform:scale(1.3) translateY(16px);opacity:0}}@keyframes ring-out{0%{transform:scale(.95);opacity:.7}100%{transform:scale(2.5);opacity:0}}@keyframes letter-unfold{from{opacity:0;transform:translateY(45px) scale(.96) rotateX(-8deg)}to{opacity:1;transform:none}}
@media(hover:hover) and (pointer:fine){.open-letter:hover{transform:translateY(-2px)}}
@media(max-width:540px){.intro{padding:80px 20px 30px;gap:20px}.scene{height:245px;margin-top:24px}.heart-caption{font-size:22px}.intro .small-note{margin-top:17px}.envelope-stage h1{margin-top:18px}.heart-drawing{margin-top:12px}.intro-footer{font-size:10px}.envelope-stage .eyebrow,.heart-stage .eyebrow{font-size:11px}}
@media(max-height:600px) and (orientation:landscape){.intro{padding:55px 20px 15px;gap:8px}.topline{top:16px}.heart-drawing{width:220px;margin:0 auto}.heart-words{font-size:53px}.heart-caption{margin:0}.scene{height:195px;margin:0}.envelope{width:230px}.envelope-stage h1{font-size:30px;margin:5px}.intro-footer{margin:0}.small-note{font-size:18px}}

/* Iniciar siempre precede al dibujo, incluso con movimiento reducido. */
body.opening-screen{background:#070609;color:#fff1f5}.opening-screen #hearts,.opening-screen .page-border{visibility:hidden}.opening-screen .intro{min-height:100svh;padding:24px;gap:0}.opening-screen h1{font-size:clamp(34px,8vw,52px);margin:0 0 36px}.opening-screen h1 em{color:#f4a1bc}.opening-screen .open-letter{background:transparent;border:1px solid #c66c8b;color:#ffe4ee;box-shadow:0 0 28px #c847691c;min-width:158px}.heart-drawing{width:min(370px,86vw);margin:0 auto}.heart-halo{opacity:0;stroke:#ed7da3}.heart-line{stroke:#f797b8;stroke-width:2.8;stroke-dashoffset:1;animation:none;filter:drop-shadow(0 0 7px #ec5a9390)}.heart-words{color:#ffd5e5;animation:none;opacity:0;inset:36% 0 auto}.drawing .heart-line{animation:draw-heart 3.2s linear forwards}.drawing .heart-words{animation:heart-text .8s ease 2.5s forwards}.intro{transition:opacity .3s var(--ease-out),transform .3s var(--ease-out)}
@keyframes heart-text{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.heart-line{stroke-dashoffset:1}.heart-words{opacity:0}.drawing .heart-line{animation:draw-heart 3.2s linear forwards!important}.drawing .heart-words{animation:heart-text .8s ease 2.5s forwards!important}}

/* Música de fondo: empieza con Iniciar; el botón permite pausarla. */

.music-toggle[hidden]{display:none}.music-toggle svg{width:18px;height:18px;fill:currentColor}.music-toggle .icon-play{display:none}.music-toggle.paused .icon-play{display:block}.music-toggle.paused .icon-pause{display:none}
.music-toggle:active{transform:scale(.94)}@media(hover:hover) and (pointer:fine){.music-toggle:hover{transform:translateY(-2px)}}
.opening-screen .music-toggle{background:#1a1016cc;border-color:#c66c8b;color:#ffe4ee}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),motion=matchMedia('(prefers-reduced-motion: reduce)');
const paragraphs=["Hola, mi amor.","Hoy ya es un mes desde que comenzamos a hablar y no puedo creer lo feliz que me haces todos los días. Me alegra tanto haber hablado contigo ese día y simplemente haber comenzado a salir contigo. No imaginaba todo lo bonito que iba a venir después de eso, ni mucho menos que en tan poquito tiempo te convertirías en alguien tan especial para mí.","Desde que llegaste a mi vida te has convertido en una parte importante de todos mis días. No puedo creer lo mucho que estás en mi mente. Quiero contarte todo lo que me pasa, quiero saber de ti, quiero verte y estar contigo todos los días. Incluso cuando no estamos juntos, de alguna manera siempre termino pensando en ti.","Me encanta lo que siento cuando estoy contigo, la tranquilidad y al mismo tiempo la emoción que me provocas. Me encanta poder conocerte cada día un poquito más, descubrir cosas nuevas de ti, escucharte y compartir momentos contigo, por más insignificantes que puedan parecer. Porque cuando se trata de ti, todo se vuelve especial para mí.","Me haces sentir cosas maravillosas y, aunque apenas llevemos un mes hablando, siento que todo lo que hemos vivido ha sido muy bonito. Cada salida, cada plática, cada abrazo, cada beso, cada risa y hasta esos pequeños momentos en los que simplemente estamos juntos significan muchísimo para mí.","Te amo y me hace demasiado feliz poder sentir algo así por ti. Quiero demostrártelo con el tiempo, con mis acciones, estando para ti, cuidándote, escuchándote y tratando de hacerte sentir tan querida como tú me haces sentir a mí.","Quiero que sepas que puedes contar conmigo. Quiero estar para ti cuando estés feliz y quieras contarme todo, pero también cuando tengas un día malo, cuando estés cansada, triste o simplemente necesites a alguien a tu lado. Quiero ser esa persona con la que puedas sentirte tranquila y querida, porque genuinamente me importa cómo te sientes y me importa hacerte feliz.","No sé exactamente qué nos espera ni todo lo que vayamos a vivir, pero sí sé algo. Quiero seguir eligiéndote. Quiero seguir conociendo cada versión de ti, estar contigo en tus días bonitos y también en los que no lo sean tanto. Quiero seguir acumulando meses, momentos, recuerdos, abrazos, besos, risas y un montón de historias contigo.","Quizá un mes todavía sea apenas el comienzo, pero qué bonito comienzo ha sido. Y espero de corazón que cuando pase mucho tiempo podamos recordar este primer mes y pensar en todo lo que comenzó desde aquí.","Gracias por aparecer en mi vida, por dejarme conocerte y por hacer que mis días sean muchísimo más bonitos simplemente por estar en ellos.","Te amo, Alejandrita. Y si de algo estoy seguro en este momento, es de que quiero estar contigo por muchísimo tiempo. ❤️"];
const now=new Date();$('date').textContent=new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'long',year:'numeric'}).format(now);$('date').dateTime=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
const nodes=paragraphs.map(()=>{const p=document.createElement('p');$('writing').append(p);return p});let timer,pi=0,ci=0,opened=false,complete=false;
function finish(){clearTimeout(timer);complete=true;nodes.forEach((p,i)=>{p.textContent=paragraphs[i];p.classList.remove('cursor')});$('ending').hidden=false;$('skip').hidden=true;}
function type(){if(complete)return;const p=nodes[pi];p.classList.add('cursor');const c=paragraphs[pi][ci++];p.textContent+=c;if(ci===paragraphs[pi].length){p.classList.remove('cursor');ci=0;pi++;if(pi===paragraphs.length){finish();return}timer=setTimeout(type,550)}else timer=setTimeout(type,/[.!?]/.test(c)?320:/[,;:]/.test(c)?180:24)}
$('skip').addEventListener('click',finish);
const stageTimers=[];let introDone=false,introStarted=false;
function later(fn,ms){const id=setTimeout(fn,ms);stageTimers.push(id);return id}
function showEnvelope(){if(introDone||opened)return;introDone=true;$('heart-stage').hidden=true;$('envelope-stage').hidden=false;document.body.classList.remove('opening-screen');$('open-letter').focus({preventScroll:true});}
function revealLetter(){stageTimers.forEach(clearTimeout);$('intro').hidden=true;$('letter').hidden=false;window.scrollTo(0,0);$('letter-title').focus({preventScroll:true});if(motion.matches)finish();else type()}
function beginIntro(){if(introStarted)return;introStarted=true;$('start-stage').hidden=true;$('heart-stage').hidden=false;$('heart-stage').classList.add('drawing');later(()=>{if(introDone)return;$('heart-stage').classList.add('depart');later(showEnvelope,motion.matches?0:300)},4700)}
$('open-letter').addEventListener('click',()=>{if(opened)return;opened=true;$('open-letter').disabled=true;$('open-letter').setAttribute('aria-busy','true');if(motion.matches){$('envelope').classList.add('open');later(revealLetter,200);return}$('envelope').classList.add('shaking');later(()=>{$('envelope').classList.remove('shaking');$('envelope').classList.add('open');later(()=>{burst(95);$('burst-ring').classList.add('go');$('envelope').classList.add('exploding')},200);later(()=>{$('intro').classList.add('leaving');later(revealLetter,300)},1150)},650)});
motion.addEventListener('change',()=>{if(!motion.matches)return;stageTimers.forEach(clearTimeout);if(opened&&$('letter').hidden)revealLetter();else if(introStarted&&!introDone)showEnvelope()});
$('start-letter').addEventListener('click',beginIntro);
const song=$('song'),musicBtn=$('music-toggle');
function syncMusic(){const paused=song.paused;musicBtn.classList.toggle('paused',paused);musicBtn.setAttribute('aria-label',paused?'Reproducir canción':'Pausar canción')}
function playSong(){song.play().catch(()=>{}).finally(syncMusic)}
$('start-letter').addEventListener('click',()=>{musicBtn.hidden=false;playSong()});
musicBtn.addEventListener('click',()=>{if(song.paused)playSong();else song.pause()});
song.addEventListener('play',syncMusic);song.addEventListener('pause',syncMusic);
const canvas=$('hearts'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,particles=[],sparks=[],raf=0,last=0;const colors=['#d65a7c','#d9284f','#ffffff','#d9ac49'];
function particle(rain=false){return{x:Math.random()*W,y:Math.random()*H,s:5+Math.random()*13,v:rain?45+Math.random()*85:12+Math.random()*22,a:.16+Math.random()*.35,t:Math.random()*6.28,color:colors[Math.floor(Math.random()*4)]}}
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);[canvas].forEach(c=>{c.width=W*d;c.height=H*d;c.getContext('2d').setTransform(d,0,0,d,0,0)});if(motion.matches)drawStatic()}
function heart(c,p){c.save();c.globalAlpha=p.a;c.translate(p.x,p.y);c.scale(p.s/20,p.s/20);c.fillStyle=p.color;c.beginPath();c.moveTo(0,6);c.bezierCurveTo(-23,-8,-12,-23,0,-10);c.bezierCurveTo(12,-23,23,-8,0,6);c.fill();c.restore()}
function drawStatic(){if(!motion.matches)return;ctx.clearRect(0,0,W,H);particles.slice(0,12).forEach(p=>heart(ctx,p));}
function burst(n){if(motion.matches)return;const rect=$('envelope').getBoundingClientRect();const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;for(let i=0;i<n;i++){const angle=Math.random()*Math.PI*2,speed=100+Math.random()*Math.min(W,600);const p=particle();Object.assign(p,{x:cx,y:cy,s:8+Math.random()*18,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-70,life:1.6+Math.random(),a:.8});sparks.push(p)}}
function frame(t){raf=0;if(motion.matches||document.hidden)return;const dt=Math.min((t-last)/1000||0,.04);last=t;ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.y-=p.v*dt;p.x+=Math.sin(t/1300+p.t)*8*dt;if(p.y< -25){p.y=H+25;p.x=Math.random()*W}heart(ctx,p)});sparks=sparks.filter(p=>p.life>0);sparks.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*1.3);p.vy+=65*dt;p.a=Math.min(.85,Math.max(0,p.life));heart(ctx,p)});raf=requestAnimationFrame(frame)}
function start(){cancelAnimationFrame(raf);raf=0;if(motion.matches){if(opened&&!$('letter').hidden)finish();drawStatic()}else if(!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
particles=Array.from({length:28},()=>particle());resize();start();addEventListener('resize',resize);document.addEventListener('visibilitychange',start);motion.addEventListener('change',start);
})();
</script></body></html>
